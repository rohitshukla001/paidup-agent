# Render Blueprint: one web service and one Postgres database.
# Paid plans are on purpose: a free web service sleeps when idle, and a
# free database expires before judging ends on 15 Dec 2026.
services:
  - type: web
    name: paidup
    runtime: docker
    plan: starter
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: paidup-db
          property: connectionString
      - key: PAYPAL_BASE_URL
        value: https://api-m.sandbox.paypal.com
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL_PRIMARY
        sync: false
      - key: GEMINI_MODEL_FALLBACK
        sync: false
      - key: GEMINI_MAX_CALLS_PER_MINUTE
        value: "8"
      - key: DEMO_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_TOKEN
        generateValue: true

databases:
  - name: paidup-db
    plan: basic-256mb
    postgresMajorVersion: "16"
    databaseName: paidup
    user: paidup
