# Render Blueprint: one free web service. The database is a free Neon
# Postgres, because a free Render database expires before judging ends on
# 15 Dec 2026. A free web service sleeps after 15 idle minutes; the first
# request after that wakes it in about a minute.
services:
  - type: web
    name: paidup
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      # The Neon connection string, without "channel_binding=require".
      - key: DATABASE_URL
        sync: false
      - key: PAYPAL_BASE_URL
        value: https://api-m.sandbox.paypal.com
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL_PRIMARY
        sync: false
      - key: GEMINI_MODEL_FALLBACK
        sync: false
      - key: GEMINI_MAX_CALLS_PER_MINUTE
        value: "8"
      - key: DEMO_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_TOKEN
        generateValue: true
